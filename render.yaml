services:
  - type: web
    name: customer-support-rag-api
    runtime: python
    buildCommand: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port ${PORT:-10000}
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LLM_BACKEND
        value: cloud
      - key: CLOUD_PROVIDER
        value: gemini
      - key: GEMINI_MODEL_NAME
        value: gemini-2.5-flash
      - key: GEMINI_KEY
        sync: false
